# GitHub Actions: 自动构建 ohmkit-tauri (Linux + Windows + macOS)

name: build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/ohmkit-tauri release/
          tar -czf ohmkit-tauri-linux.tar.gz -C release .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir release
          cp target/${{ matrix.target }}/release/ohmkit-tauri.exe release/
          Compress-Archive -Path release/* -DestinationPath ohmkit-tauri-windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/ohmkit-tauri release/
          tar -czf ohmkit-tauri-macos.tar.gz -C release .

      - uses: actions/upload-artifact@v4
        with:
          name: ohmkit-tauri-${{ runner.os }}
          path: ohmkit-tauri-*
