# GitHub Actions: 自动构建 ohmkit-tauri (Linux + Windows + macOS)

name: build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            platform: linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            platform: windows
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/ohmkit-tauri${{ matrix.ext }} release/
            7z a ohmkit-tauri-windows.zip ./release/*
          else
            cp target/${{ matrix.target }}/release/ohmkit-tauri${{ matrix.ext }} release/
            tar -czf ohmkit-tauri-${{ matrix.platform }}.tar.gz -C release .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ohmkit-tauri-${{ matrix.platform }}
          path: ohmkit-tauri-${{ matrix.platform }}.*
